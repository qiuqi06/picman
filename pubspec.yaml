name: picman
description: Utilities to stitch images by removing overlaps and to convert video to long image in Flutter/Dart.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.2.0
  # ffmpeg_kit_flutter_full_gpl: ^5.1.0  # 暂时注释掉，避免 iOS 构建问题
  path: ^1.9.0
  uuid: ^4.4.0
  file_picker: ^8.1.2
  image_picker: ^1.0.7

flutter:
  assets:
    - assets/
